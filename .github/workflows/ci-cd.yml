name: PhotoShare Enterprise CI/CD

on:
  push:
    branches: [ main ]

jobs:
  # 1. Quality Gate: Validation
  validation:
    name: Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: photoshare_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Validate Backend
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_USER: postgres
          DB_PASSWORD: password
          DB_NAME: photoshare_test_db
          NODE_ENV: test
          JWT_SECRET: test_secret
        run: |
          npm ci
          npm test -- --passWithNoTests

      - name: Validate Frontend
        working-directory: ./frontend
        env:
          CI: false # Prevents warnings from being treated as errors for faster assignment delivery
        run: |
          npm ci
          npm run build

  # 2. Build & Push (Azure will auto-deploy via Webhook)
  release:
    name: Build & Push to ACR
    needs: [validation]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ACR
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.ACR_NAME }}.azurecr.io/photoshare-backend:latest

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.ACR_NAME }}.azurecr.io/photoshare-frontend:latest
